
<div class="mask">
<div class="login-container">
   <div class="form-group">
      <label for="exampleInputEmail1">Email address</label>
      <input type="email" class="form-control"  aria-describedby="emailHelp" [(ngModel)]="loginModel().username" placeholder="Enter email">
    </div>
    <br>
    <div class="form-group">
      <label for="exampleInputPassword1">Password</label>
      <input type="password" class="form-control" [(ngModel)]="loginModel().password" placeholder="Password">
    </div>
   <hr>
    <button type="button" (click) = "handleLoginSubmit()"class="btn btn-primary">Submit</button>
</div>
</div>
